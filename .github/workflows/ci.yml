name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencias
        run: python -m pip install --upgrade pip pytest
      - name: Pruebas
        run: python -m pytest -q
      - name: Demo reproducible
        run: python rca.py --demo
